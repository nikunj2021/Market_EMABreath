name: Index screener dashboard
on:
  schedule:
    - cron: "15 17 * * 1-5"   # 22:45 IST Mon-Fri, 45 min after the sheet updates at 22:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-screener
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python breadth_dashboard.py
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASH_URL: ${{ vars.DASH_URL }}
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          [ -f docs/state.json ] && git add docs/state.json || true
          git diff --staged --quiet || (git commit -m "Update index screener $(date -u +%F)" && git pull --rebase && git push)
